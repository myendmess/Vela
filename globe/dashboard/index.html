<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Vela — Market Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%2334ebac'/%3E%3Cstop offset='1' stop-color='%233bcdf0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230c0d12'/%3E%3Crect x='1.5' y='1.5' width='61' height='61' rx='14.5' fill='none' stroke='url(%23g)' stroke-width='2'/%3E%3Ctext x='32' y='44' font-family='monospace' font-size='34' font-weight='700' fill='url(%23g)' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root{--up:#089981;--down:#f23645}
    html,body{height:100%}
    .tnum{font-variant-numeric:tabular-nums}
    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-thumb{background:#1e222d;border-radius:4px}
    ::-webkit-scrollbar-track{background:transparent}
    .fade-in{animation:fi .25s ease}
    @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){.fade-in{animation:none}}
  </style>
</head>
<body class="bg-[#0c0d12] text-slate-200 flex flex-col h-screen overflow-hidden font-sans antialiased">

  <!-- ============ TOP NAV ============ -->
  <header class="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-2.5 border-b border-[#1e222d] shrink-0">
    <a href="https://github.com/myendmess/Vela" target="_blank" rel="noopener" title="Vela source"
       aria-label="Vela on GitHub" class="block w-9 h-9 shrink-0 drop-shadow-[0_0_6px_rgba(59,205,240,0.45)]">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="neonGrad" x1="15" y1="90" x2="90" y2="10" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#34ebac" /> <stop offset="50%" stop-color="#3bcdf0" /> <stop offset="100%" stop-color="#42b9f5" /> </linearGradient>
        </defs>
        <g stroke="url(#neonGrad)" stroke-linejoin="round">
          <path d="M 15 25 L 30 25 L 50 55 L 70 30 L 55 30 L 90 10 L 96 35 L 80 35 L 48 78 L 40 90 Z"
                fill="url(#neonGrad)" fill-opacity="0.1" stroke-width="1.8" />
          <path d="M 52 81 L 84 38 L 90 43 L 58 86 Z"
                fill="url(#neonGrad)" fill-opacity="0.1" stroke-width="1.8" />
          <g fill="none" stroke-width="0.75" opacity="0.9">
            <polyline points="22,35 27,42 27,55 36,70" />
            <polyline points="65,75 75,62 75,50 82,45" />
          </g>
          <circle cx="36" cy="70" r="1.3" fill="url(#neonGrad)" stroke="none" />
          <circle cx="82" cy="45" r="1.3" fill="url(#neonGrad)" stroke="none" />
        </g>
      </svg>
    </a>
    <h1 class="text-[15px] font-bold m-0">Market <span class="text-amber-400">Map</span></h1>

    <a href="../" class="text-xs text-slate-500 hover:text-amber-400 transition-colors" title="Back to region globe">← Globe</a>

    <nav id="crumbs" class="hidden md:block text-xs text-slate-500" aria-label="Index path"></nav>

    <div id="chips" class="flex items-center gap-2" role="group" aria-label="Indices"></div>

    <label class="flex items-center gap-1.5 text-[11px] text-slate-500">
      Color by
      <select id="metric" class="bg-[#131722] border border-[#1e222d] text-slate-200 rounded-md px-2 py-1 text-xs outline-none cursor-pointer focus:border-amber-400">
        <option value="1d" selected>1-Day</option>
        <option value="1w">1-Week</option>
        <option value="1m">1-Month</option>
        <option value="3m">3-Month (Quarter)</option>
        <option value="6m">6-Month (Half)</option>
        <option value="1y">1-Year</option>
        <option value="mtd">Month-to-Date</option>
        <option value="low">Gain from 52w Low</option>
      </select>
    </label>

    <div class="relative ml-auto w-56">
      <input id="sin" type="text" placeholder="Search ticker or company…" autocomplete="off"
             class="w-full bg-[#131722] border border-[#1e222d] text-slate-200 rounded-md px-3 py-1.5 text-xs outline-none focus:border-amber-400 placeholder:text-slate-600" />
      <div id="sdd" class="absolute top-9 inset-x-0 bg-[#131722] border border-[#1e222d] rounded-md z-40 hidden max-h-72 overflow-auto shadow-2xl shadow-black/50"></div>
    </div>
  </header>

  <!-- ============ WORKSPACE: map 75% / sidebar 25% ============ -->
  <main class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-4 gap-2 px-3 py-2 overflow-y-auto lg:overflow-hidden">

    <section class="lg:col-span-3 h-[55vh] lg:h-auto rounded-lg border border-[#1e222d] overflow-hidden bg-[#0a0b0f]" aria-label="Market treemap">
      <div id="map" class="w-full h-full"></div>
    </section>

    <aside class="lg:col-span-1 min-h-[24rem] lg:min-h-0 rounded-lg border border-[#1e222d] bg-[#11131a] flex flex-col overflow-hidden" aria-label="Stock inspector">
      <div id="sb-empty" class="flex-1 flex flex-col items-center justify-center gap-2 text-slate-600 text-sm px-6 text-center">
        <span class="text-2xl">⌖</span>
        <p>Click a tile to inspect a stock.<br><span class="text-xs">Click a sector title to isolate it.</span></p>
      </div>

      <div id="sb-body" class="hidden flex-1 min-h-0 flex-col">
        <div class="px-4 pt-3 pb-2 border-b border-[#1e222d]">
          <div class="flex items-center gap-2">
            <span id="sb-tkr" class="text-xl font-extrabold tracking-tight"></span>
            <a id="sb-tv" href="#" target="_blank" rel="noopener"
               class="ml-auto text-[11px] font-semibold px-2.5 py-1 rounded-md bg-[#2962ff] hover:bg-[#1e4fd6] text-white transition-colors">
              View on TradingView ↗
            </a>
          </div>
          <div id="sb-name" class="text-sm text-slate-400 mt-0.5"></div>
          <div id="sb-class" class="text-[11px] text-slate-500"></div>
        </div>

        <div class="px-4 py-3 border-b border-[#1e222d] flex items-center gap-3">
          <span id="sb-price" class="text-2xl font-bold tnum"></span>
          <span id="sb-chg" class="text-base font-semibold tnum"></span>
          <span id="sb-spark" class="ml-auto"></span>
        </div>

        <div class="px-4 py-2.5 border-b border-[#1e222d] grid grid-cols-3 gap-2 text-[11px] text-slate-500">
          <div><div class="text-slate-600">52w range</div><div id="sb-range" class="text-slate-300 tnum"></div></div>
          <div><div class="text-slate-600">52w pos</div><div id="sb-pos" class="text-slate-300 tnum"></div></div>
          <div><div class="text-slate-600">Mkt cap</div><div id="sb-mcap" class="text-slate-300 tnum"></div></div>
        </div>

        <div class="px-4 py-2.5 border-b border-[#1e222d] bg-white/[0.02] text-xs">
          <div class="text-[10px] uppercase tracking-wider text-slate-600 mb-1.5">Context — <span id="sb-ctx-metric"></span></div>
          <div class="flex justify-between gap-2 py-0.5">
            <span id="sb-sec-name" class="text-slate-400 truncate"></span>
            <span id="sb-sec-val" class="font-semibold tnum shrink-0"></span>
          </div>
          <div class="flex justify-between gap-2 py-0.5">
            <span id="sb-ind-name" class="text-slate-400 truncate"></span>
            <span id="sb-ind-val" class="font-semibold tnum shrink-0"></span>
          </div>
        </div>

        <div class="px-4 pt-2 pb-1 text-[10px] uppercase tracking-wider text-slate-600 shrink-0">
          Industry peers · <span id="sb-peers-metric"></span>
        </div>
        <div id="sb-peers" class="flex-1 min-h-0 overflow-y-auto"></div>
      </div>
    </aside>
  </main>

  <!-- ============ BOTTOM: legend + status ============ -->
  <footer class="shrink-0 flex flex-wrap items-center gap-x-4 gap-y-1 px-4 py-1.5 border-t border-[#1e222d] text-[11px] text-slate-500">
    <span id="status">Loading…</span>
    <div class="flex items-center gap-2 ml-auto">
      <span id="lg-lo" class="tnum"></span>
      <span class="w-40 h-2.5 rounded"
            style="background:linear-gradient(90deg,#f23645,#803039 35%,#363a45 50%,#1e5f52 65%,#089981)"></span>
      <span id="lg-hi" class="tnum"></span>
    </div>
    <span>size = market cap · research only — not advice ·
      <a class="text-amber-400 hover:underline" href="https://myendmess.github.io" target="_blank" rel="noopener">myendmess.github.io</a></span>
  </footer>

  <script>
    const METRICS={'1d':{label:'1-Day',range:3},'1w':{label:'1-Week',range:6},
      '1m':{label:'1-Month',range:12},'3m':{label:'3-Month',range:25},'6m':{label:'6-Month',range:40},
      '1y':{label:'1-Year',range:60},mtd:{label:'Month-to-Date',range:12},
      low:{label:'Gain from 52-week low'}};
    let RAW=[],chart=null,metric='1d',current=null;

    // ---------- color scale: deep red → dark gray → vivid green ----------
    const lerp=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
    const C_DOWN=[242,54,69],C_MID=[54,58,69],C_UP=[8,153,129];
    function colorRet(v,range){if(v==null)return '#2a2e39';const t=Math.max(-1,Math.min(1,v/range));
      const c=t>=0?lerp(C_MID,C_UP,t):lerp(C_MID,C_DOWN,-t);return `rgb(${c[0]},${c[1]},${c[2]})`;}
    function colorPos(p){if(p==null)return '#2a2e39';
      const c=p<0.5?lerp(C_DOWN,C_MID,p/0.5):lerp(C_MID,C_UP,(p-0.5)/0.5);return `rgb(${c[0]},${c[1]},${c[2]})`;}

    const fmtB=v=>CUR+(v/1e9).toFixed(v>=1e11?0:1)+'B';
    const gainFromLow=r=>(r.price&&r.wk52_low>0)?(r.price-r.wk52_low)/r.wk52_low*100:null;
    const metricVal=s=>metric==='low'?gainFromLow(s):(s.perf?s.perf[metric]:null);
    const metricColor=s=>metric==='low'?colorPos(s.wk52_position):colorRet(metricVal(s),METRICS[metric].range);
    const pctStr=(v,d=2)=>v==null?'n/a':(v>=0?'+':'')+v.toFixed(d)+'%';
    const pctColor=v=>v==null?'#8b97a7':(v>=0?'var(--up)':'var(--down)');
    const tvURL=t=>'https://www.tradingview.com/chart/?symbol='+encodeURIComponent(t);

    function sparkSVG(spark,w=64,h=18){
      if(!spark||spark.length<2)return '';
      const mn=Math.min(...spark),mx=Math.max(...spark),rng=(mx-mn)||1;
      const pts=spark.map((v,i)=>`${(i/(spark.length-1)*w).toFixed(1)},${(h-((v-mn)/rng)*h).toFixed(1)}`).join(' ');
      const up=spark[spark.length-1]>=spark[0];
      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${up?'#089981':'#f23645'}" stroke-width="1.2"/></svg>`;
    }

    // cap-weighted average of the current metric over a set of rows
    function wavg(rows){let n=0,d=0;
      for(const r of rows){const v=metricVal(r);if(v==null||!r.market_cap)continue;n+=v*r.market_cap;d+=r.market_cap;}
      return d?n/d:null;}

    // ---------- treemap data (explicit ids so we can zoom programmatically) ----------
    function buildTree(rows){
      const sectors={};
      for(const r of rows){const sec=r.gics_sector||'Unknown',ind=r.gics_sub_industry||'Other';
        (sectors[sec]=sectors[sec]||{});(sectors[sec][ind]=sectors[sec][ind]||[]).push(r);}
      return Object.entries(sectors).map(([sec,inds])=>({name:sec,id:'S:'+sec,
        children:Object.entries(inds).map(([ind,stocks])=>({name:ind,id:'I:'+sec+'|'+ind,
          children:stocks.map(s=>({name:s.ticker,id:'T:'+s.ticker,value:s.market_cap,mval:metricVal(s),
            itemStyle:{color:metricColor(s)},_raw:s}))}))}));
    }

    // ---------- sidebar ----------
    function anchor(s){
      current=s;
      document.getElementById('sb-empty').classList.add('hidden');
      const body=document.getElementById('sb-body');
      body.classList.remove('hidden');body.classList.add('flex','fade-in');
      document.getElementById('sb-tkr').textContent=s.ticker;
      document.getElementById('sb-tv').href=tvURL(s.ticker);
      document.getElementById('sb-name').textContent=s.name;
      document.getElementById('sb-class').textContent=`${s.gics_sector} · ${s.gics_sub_industry}`;
      document.getElementById('sb-price').textContent=s.price!=null?CUR+s.price.toFixed(2):'—';
      const v=metricVal(s),chg=document.getElementById('sb-chg');
      chg.textContent=pctStr(v);chg.style.color=pctColor(v);
      document.getElementById('sb-spark').innerHTML=sparkSVG(s.spark,110,28);
      document.getElementById('sb-range').textContent=`${s.wk52_low}–${s.wk52_high}`;
      document.getElementById('sb-pos').textContent=s.wk52_position!=null?(s.wk52_position*100).toFixed(0)+'%':'n/a';
      document.getElementById('sb-mcap').textContent=fmtB(s.market_cap);

      const secRows=RAW.filter(r=>r.gics_sector===s.gics_sector);
      const peers=RAW.filter(r=>r.gics_sub_industry===s.gics_sub_industry).sort((a,b)=>b.market_cap-a.market_cap);
      document.getElementById('sb-ctx-metric').textContent=METRICS[metric].label;
      document.getElementById('sb-sec-name').textContent=`${s.gics_sector} (${secRows.length})`;
      const sv=wavg(secRows),se=document.getElementById('sb-sec-val');se.textContent=pctStr(sv,1);se.style.color=pctColor(sv);
      document.getElementById('sb-ind-name').textContent=`${s.gics_sub_industry} (${peers.length})`;
      const iv=wavg(peers),ie=document.getElementById('sb-ind-val');ie.textContent=pctStr(iv,1);ie.style.color=pctColor(iv);

      document.getElementById('sb-peers-metric').textContent=METRICS[metric].label;
      const list=document.getElementById('sb-peers');list.innerHTML='';
      for(const p of peers){const pv=metricVal(p);const row=document.createElement('div');
        row.className='grid grid-cols-[46px_64px_1fr_66px] gap-2 items-center px-4 py-1.5 text-[13px] cursor-pointer border-t border-[#161b26] hover:bg-[#1a2030]'+(p.ticker===s.ticker?' bg-[#1c2433]':'');
        row.innerHTML=`<span class="font-bold">${p.ticker}</span><span>${sparkSVG(p.spark)}</span>`+
          `<span class="text-right tnum">${p.price!=null?p.price.toFixed(2):'—'}</span>`+
          `<span class="text-right font-semibold tnum" style="color:${pctColor(pv)}">${pctStr(pv)}</span>`;
        row.onclick=()=>anchor(p);list.appendChild(row);}
    }

    // ---------- search ----------
    function renderSearch(q){
      const dd=document.getElementById('sdd');
      if(!q){dd.classList.add('hidden');dd.innerHTML='';return;}
      const Q=q.toUpperCase();
      const m=RAW.filter(r=>r.ticker.toUpperCase().startsWith(Q)||r.name.toUpperCase().includes(Q)).slice(0,8);
      dd.innerHTML='';if(!m.length){dd.classList.add('hidden');return;}
      for(const r of m){const it=document.createElement('div');
        it.className='px-3 py-1.5 text-xs cursor-pointer flex gap-2 hover:bg-[#1a2030]';
        it.innerHTML=`<b class="text-amber-400">${r.ticker}</b><span class="text-slate-500 truncate">${r.name}</span>`;
        it.onclick=()=>selectStock(r.ticker);dd.appendChild(it);}
      dd.classList.remove('hidden');
    }
    function selectStock(tkr){
      const s=RAW.find(r=>r.ticker===tkr);if(!s)return;
      document.getElementById('sin').value='';document.getElementById('sdd').classList.add('hidden');
      if(chart){try{chart.dispatchAction({type:'treemapZoomToNode',seriesIndex:0,
        targetNodeId:'I:'+(s.gics_sector||'Unknown')+'|'+(s.gics_sub_industry||'Other')});}catch(e){}}
      anchor(s);
    }

    // ---------- legend / status ----------
    function updateLegend(){
      const lo=document.getElementById('lg-lo'),hi=document.getElementById('lg-hi');
      if(metric==='low'){lo.textContent='52w low';hi.textContent='52w high';}
      else{const r=METRICS[metric].range;lo.textContent='−'+r+'%';hi.textContent='+'+r+'%';}
      document.getElementById('status').textContent=`${INDEX.label} · ${RAW.length} names · color = ${METRICS[metric].label}`;
    }
    function refresh(){
      if(chart)chart.setOption({series:[{data:buildTree(RAW)}]});
      updateLegend();
      if(current)anchor(current);
    }

    // ---------- chart ----------
    const SERIES_BASE={type:'treemap',roam:false,nodeClick:false,
      width:'100%',height:'100%',top:0,left:0,right:0,bottom:0,
      label:{show:true,color:'#fff',fontSize:11,fontWeight:600,lineHeight:13,
        formatter:p=>{const v=p.data&&p.data.mval;return v==null?p.name:`${p.name}\n${v>=0?'+':''}${Math.round(v)}%`;}},
      upperLabel:{show:true,height:20,color:'#cbd5e1',fontSize:11},
      itemStyle:{borderColor:'#0c0d12',borderWidth:1,gapWidth:1},
      levels:[{itemStyle:{borderColor:'#0c0d12',borderWidth:5,gapWidth:5},upperLabel:{show:true,color:'#fbbf24',fontWeight:700}},
        {itemStyle:{borderColor:'#0c0d12',borderWidth:2,gapWidth:2}},{itemStyle:{borderWidth:1,gapWidth:1}}],
      breadcrumb:{show:true,bottom:6,itemStyle:{color:'#131722'},textStyle:{color:'#8b97a7'}}};

    // ---------- index registry (Global Markets -> Region -> Country -> Index) ----------
    // Shared registry: ../indexes.json (globe/indexes.json) is the single source of
    // truth for BOTH the globe landing page and this dashboard — label/status/scope,
    // plus file/path/cur for live entries. Adding an index = one universe CSV + one
    // builder + one registry entry (see globe/README.md roadmap).
    let INDEXES,INDEX_ID,INDEX,CUR;
    // Daily cache-bust: data refreshes once a day, so a date-stamped URL keeps
    // browsers from serving yesterday's JSON without disabling caching entirely.
    const DAY=new Date().toISOString().slice(0,10);
    fetch('../indexes.json?v='+DAY).then(r=>r.json()).then(REGISTRY=>{
      INDEXES={};
      for(const [id,e] of Object.entries(REGISTRY))if(e.status==='live')INDEXES[id]=e;
      const COMING_SOON=Object.values(REGISTRY).filter(e=>e.status!=='live').map(e=>e.label);
      const q=(new URLSearchParams(location.search).get('index')||'sp500').toLowerCase();
      INDEX_ID=INDEXES[q]?q:'sp500';
      INDEX=INDEXES[INDEX_ID];
      CUR=INDEX.cur;
      document.title=`Vela — ${INDEX.label} Map`;
      document.getElementById('crumbs').innerHTML=
        INDEX.path.map(p=>`${p} <span class="mx-1">›</span>`).join('')+
        `<span class="text-slate-200 font-semibold">${INDEX.label}</span>`;
      document.getElementById('chips').innerHTML=
        Object.entries(INDEXES).map(([id,ix])=>id===INDEX_ID
          ?`<span class="text-[11px] px-3 py-1 rounded-full bg-amber-400 text-[#0c0d12] font-bold">${ix.label}</span>`
          :`<a href="?index=${id}" class="text-[11px] px-3 py-1 rounded-full border border-amber-400/60 text-amber-300 hover:bg-amber-400 hover:text-[#0c0d12] transition-colors font-semibold">${ix.label}</a>`
        ).join('')+
        `<span class="hidden lg:inline text-[11px] px-3 py-1 rounded-full border border-[#1e222d] text-slate-500 cursor-default" title="${COMING_SOON.join(', ')} — coming soon">+${COMING_SOON.length} · Coming Soon</span>`;
      return fetch(INDEX.file+'?v='+DAY);
    }).then(r=>r.json()).then(rows=>{
      RAW=rows;
      chart=echarts.init(document.getElementById('map'),null,{renderer:'canvas'});
      chart.setOption({backgroundColor:'transparent',
        tooltip:{backgroundColor:'rgba(19,23,34,.94)',borderColor:'#1e222d',
          textStyle:{color:'#e6edf3',fontSize:12},
          formatter:info=>{const d=info.data&&info.data._raw;
            if(!d)return `<b>${info.name}</b><br>${fmtB(info.value)}`;
            let html=`<b>${d.ticker}</b> — ${d.name}<br>`+
              `<span style="color:#8b97a7">${CUR}${d.price} · 1D <span style="color:${pctColor(d.perf&&d.perf['1d'])}">${pctStr(d.perf&&d.perf['1d'])}</span></span>`;
            if(metric!=='1d')html+=`<br><span style="color:#8b97a7">${METRICS[metric].label} ${pctStr(metricVal(d))}</span>`;
            return html+`<br><span style="color:#61708d;font-size:11px">click to inspect ↗</span>`;}},
        series:[Object.assign({},SERIES_BASE,{data:buildTree(rows)})]});
      // leaf click = anchor in sidebar; group click (sector/industry title) = isolate it
      chart.on('click',p=>{
        if(p.data&&p.data._raw){anchor(p.data._raw);}
        else if(p.data&&p.data.id){try{chart.dispatchAction({type:'treemapZoomToNode',seriesIndex:0,targetNodeId:p.data.id});}catch(e){}}
      });
      window.addEventListener('resize',()=>chart.resize());
      updateLegend();
    }).catch(e=>{document.getElementById('status').textContent='Failed to load data: '+e;});

    document.getElementById('metric').addEventListener('change',e=>{metric=e.target.value;refresh();});
    document.getElementById('sin').addEventListener('input',e=>renderSearch(e.target.value.trim()));
    document.getElementById('sin').addEventListener('keydown',e=>{
      if(e.key==='Enter'){const f=document.querySelector('#sdd div');if(f)f.click();}
      else if(e.key==='Escape'){document.getElementById('sdd').classList.add('hidden');}});
  </script>
</body>
</html>
