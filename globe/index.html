<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Vela — Global Market Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%2334ebac'/%3E%3Cstop offset='1' stop-color='%233bcdf0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230c0d12'/%3E%3Crect x='1.5' y='1.5' width='61' height='61' rx='14.5' fill='none' stroke='url(%23g)' stroke-width='2'/%3E%3Ctext x='32' y='44' font-family='monospace' font-size='34' font-weight='700' fill='url(%23g)' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    html,body{height:100%}
    #globe{position:absolute;inset:0}
    .maplibregl-ctrl-attrib{opacity:.35}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){.pulse{animation:none}}
  </style>
</head>
<body class="bg-[#0c0d12] text-slate-200 h-screen overflow-hidden font-sans antialiased relative">

  <!-- ============ TOP NAV ============ -->
  <header class="absolute top-0 inset-x-0 z-10 flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-2.5 border-b border-[#1e222d] bg-[#0c0d12]/80 backdrop-blur">
    <a href="https://github.com/myendmess/Vela" target="_blank" rel="noopener" title="Vela source"
       aria-label="Vela on GitHub" class="block w-9 h-9 shrink-0 drop-shadow-[0_0_6px_rgba(59,205,240,0.45)]">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="neonGrad" x1="15" y1="90" x2="90" y2="10" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#34ebac" /> <stop offset="50%" stop-color="#3bcdf0" /> <stop offset="100%" stop-color="#42b9f5" /> </linearGradient>
        </defs>
        <g stroke="url(#neonGrad)" stroke-linejoin="round">
          <path d="M 15 25 L 30 25 L 50 55 L 70 30 L 55 30 L 90 10 L 96 35 L 80 35 L 48 78 L 40 90 Z"
                fill="url(#neonGrad)" fill-opacity="0.1" stroke-width="1.8" />
          <path d="M 52 81 L 84 38 L 90 43 L 58 86 Z"
                fill="url(#neonGrad)" fill-opacity="0.1" stroke-width="1.8" />
          <g fill="none" stroke-width="0.75" opacity="0.9">
            <polyline points="22,35 27,42 27,55 36,70" />
            <polyline points="65,75 75,62 75,50 82,45" />
          </g>
          <circle cx="36" cy="70" r="1.3" fill="url(#neonGrad)" stroke="none" />
          <circle cx="82" cy="45" r="1.3" fill="url(#neonGrad)" stroke="none" />
        </g>
      </svg>
    </a>
    <h1 class="text-[15px] font-bold m-0">Global <span class="text-amber-400">Market Map</span></h1>
    <p class="hidden md:block text-xs text-slate-500">Click a highlighted region to open its market</p>

    <div class="ml-auto flex items-center gap-3 text-[11px]">
      <span id="legend-markets" class="flex items-center gap-3">
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span>Live</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#3bcdf0]/50 inline-block"></span>Coming soon</span>
      </span>
      <span id="legend-world" class="hidden items-center gap-1.5">
        <span class="inline-block w-24 h-2.5 rounded-full" style="background:linear-gradient(90deg,#171c2b,#fbbf24)"></span>
        <span id="legend-world-label" class="text-slate-400">% of VWCE</span>
      </span>
      <button id="world-toggle"
              class="px-3 py-1.5 rounded-md border border-[#1e222d] text-slate-300 hover:border-[#3bcdf0] hover:text-[#3bcdf0] transition-colors font-semibold">
        🌍 VWCE World
      </button>
      <a href="dashboard/" class="px-3 py-1.5 rounded-md border border-[#1e222d] text-slate-300 hover:border-amber-400 hover:text-amber-400 transition-colors font-semibold">
        Skip to dashboard →
      </a>
    </div>
  </header>

  <div id="globe"></div>

  <!-- Hover tooltip -->
  <div id="tip" class="hidden absolute z-20 pointer-events-none px-3 py-2 rounded-md bg-[#131722]/95 border border-[#1e222d] text-xs shadow-2xl shadow-black/50"></div>

  <!-- Toast for "coming soon" clicks -->
  <div id="toast" class="hidden absolute z-20 bottom-8 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full bg-[#131722] border border-[#3bcdf0]/40 text-xs text-slate-200 shadow-2xl shadow-black/50"></div>

  <!-- Multi-index picker (countries with more than one associated index) -->
  <div id="picker" class="hidden absolute z-30 min-w-[190px] rounded-md bg-[#131722]/95 border border-[#1e222d] text-xs shadow-2xl shadow-black/50 overflow-hidden"></div>

  <!-- Shown only if the registry / country shapes fail to download -->
  <div id="globe-error" class="hidden absolute inset-0 z-30 flex items-center justify-center bg-[#0c0d12] px-6 text-center">
    <div class="max-w-md space-y-3">
      <h2 class="text-lg font-bold text-amber-400">Couldn't load the globe</h2>
      <p class="text-sm text-slate-400">
        The index registry or the country shapes failed to download. Refresh to retry,
        or jump straight to the dashboard.
      </p>
      <a href="dashboard/" class="inline-block mt-2 px-4 py-2 rounded-md border border-[#1e222d] text-slate-300 hover:border-amber-400 hover:text-amber-400 transition-colors font-semibold text-sm">
        Skip to dashboard →
      </a>
    </div>
  </div>

  <script>
    // No API key needed: MapLibre GL JS (open source) renders the globe, and the
    // country shapes are Natural Earth data (public domain) served by unpkg's CDN
    // via the world-atlas package. Fully free — no account, no token, no card.
    //
    // indexes.json (shared with dashboard/) is the single source of truth: every
    // dataset has a scope — country (S&P 500 → US), region (STOXX 600 → member
    // countries as one hover group), or world (VWCE → allocation-colored globe).

    // world-atlas keys countries by ISO 3166-1 numeric id; the registry and the
    // VWCE weights use alpha-2. Covers every country any scope or weight can name.
    const NUM_TO_ISO2 = {
      840:'US', 124:'CA', 484:'MX', 76:'BR', 152:'CL', 170:'CO', 604:'PE',
      826:'GB', 372:'IE', 250:'FR', 276:'DE', 380:'IT', 724:'ES', 620:'PT',
      528:'NL', 56:'BE', 442:'LU', 40:'AT', 756:'CH', 208:'DK', 752:'SE',
      578:'NO', 246:'FI', 616:'PL', 203:'CZ', 348:'HU', 300:'GR', 792:'TR',
      392:'JP', 156:'CN', 344:'HK', 158:'TW', 410:'KR', 356:'IN', 702:'SG',
      360:'ID', 458:'MY', 764:'TH', 608:'PH', 36:'AU', 554:'NZ',
      376:'IL', 682:'SA', 784:'AE', 634:'QA', 414:'KW', 710:'ZA', 818:'EG',
    };

    const DAY = new Date().toISOString().slice(0, 10);
    const NONE = ['__none__'];                    // match/in expressions reject empty arrays
    const codesOr = a => a.length ? a : NONE;

    let REGISTRY = null;      // indexes.json
    let BY_COUNTRY = {};      // ISO2 -> [{id, label, status, scope}]
    let WORLD_ENTRY = null;   // the world-scope entry (VWCE), if any
    let VWCE = null;          // lazily fetched {as_of, source, weights}
    let mode = 'markets';     // 'markets' | 'world'
    let FILL_COLOR_MARKETS, FILL_OPACITY_MARKETS;

    const map = new maplibregl.Map({
      container: 'globe',
      style: {
        version: 8,
        projection: { type: 'globe' },
        sky: {
          'sky-color': '#0b101f',
          'horizon-color': '#141928',
          'fog-color': '#0c0d12',
          'sky-horizon-blend': 0.6,
          'horizon-fog-blend': 0.6,
          'fog-ground-blend': 0.7,
          'atmosphere-blend': 0.35,
        },
        sources: {},
        layers: [
          { id: 'ocean', type: 'background', paint: { 'background-color': '#101522' } },
        ],
      },
      zoom: 1.4,
      center: [10, 25],
      attributionControl: { compact: true, customAttribution: 'Natural Earth · MapLibre' },
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
    map.scrollZoom.disable();
    map.dragRotate.enable();

    Promise.all([
      new Promise(resolve => map.on('load', resolve)),
      fetch('indexes.json?v=' + DAY)
        .then(r => { if (!r.ok) throw new Error(`registry download failed: ${r.status}`); return r.json(); }),
      fetch('https://unpkg.com/world-atlas@2.0.2/countries-110m.json')
        .then(r => { if (!r.ok) throw new Error(`countries download failed: ${r.status}`); return r.json(); }),
    ]).then(([, registry, topo]) => {
      REGISTRY = registry;

      for (const [id, e] of Object.entries(REGISTRY)) {
        const entry = Object.assign({ id }, e);
        if (e.scope.type === 'country') {
          (BY_COUNTRY[e.scope.code] = BY_COUNTRY[e.scope.code] || []).push(entry);
        } else if (e.scope.type === 'region') {
          for (const c of e.scope.countries) (BY_COUNTRY[c] = BY_COUNTRY[c] || []).push(entry);
        } else if (e.scope.type === 'world') {
          WORLD_ENTRY = entry;
        }
      }
      const liveCodes = Object.keys(BY_COUNTRY).filter(c => BY_COUNTRY[c].some(e => e.status === 'live'));
      const soonCodes = Object.keys(BY_COUNTRY).filter(c => !BY_COUNTRY[c].some(e => e.status === 'live'));

      const countries = topojson.feature(topo, topo.objects.countries);
      countries.features.forEach(f => { f.properties.iso = NUM_TO_ISO2[+f.id] || ''; });
      map.addSource('countries', { type: 'geojson', data: countries });

      map.addLayer({
        id: 'land',
        type: 'fill',
        source: 'countries',
        paint: { 'fill-color': '#171c2b' },
      });
      map.addLayer({
        id: 'land-outline',
        type: 'line',
        source: 'countries',
        paint: { 'line-color': '#262e42', 'line-width': 0.5 },
      });
      // Region hover group: filter is swapped to the hovered region's member list.
      map.addLayer({
        id: 'region-hover',
        type: 'fill',
        source: 'countries',
        filter: ['in', ['get', 'iso'], ['literal', NONE]],
        paint: { 'fill-color': '#3bcdf0', 'fill-opacity': 0.14 },
      });

      FILL_COLOR_MARKETS = [
        'match', ['get', 'iso'],
        codesOr(liveCodes), '#fbbf24',
        codesOr(soonCodes), '#3bcdf0',
        'rgba(0,0,0,0)',
      ];
      FILL_OPACITY_MARKETS = [
        'match', ['get', 'iso'],
        codesOr(liveCodes), 0.55,
        codesOr(soonCodes), 0.22,
        0,
      ];
      map.addLayer({
        id: 'country-fill',
        type: 'fill',
        source: 'countries',
        paint: { 'fill-color': FILL_COLOR_MARKETS, 'fill-opacity': FILL_OPACITY_MARKETS },
      });
      map.addLayer({
        id: 'country-outline',
        type: 'line',
        source: 'countries',
        filter: ['in', ['get', 'iso'], ['literal', codesOr(liveCodes)]],
        paint: { 'line-color': '#fbbf24', 'line-width': 1.2 },
      });

      const tip = document.getElementById('tip');
      const toast = document.getElementById('toast');
      const picker = document.getElementById('picker');
      let toastTimer;

      const showToast = msg => {
        clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.classList.remove('hidden');
        toastTimer = setTimeout(() => toast.classList.add('hidden'), 2200);
      };
      const closePicker = () => picker.classList.add('hidden');
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });

      const regionMembersOf = iso => {
        const regions = (BY_COUNTRY[iso] || []).filter(e => e.scope.type === 'region');
        return regions.length ? regions.flatMap(e => e.scope.countries) : null;
      };

      map.on('mousemove', 'country-fill', e => {
        const f = e.features[0];
        const iso = f.properties.iso;
        const name = f.properties.name;

        if (mode === 'world') {
          const w = VWCE && VWCE.weights[iso];
          tip.innerHTML = w != null
            ? `<b class="text-amber-400">${name}</b><br>${w >= 1 ? w.toFixed(1) : w.toFixed(2)}% of ${WORLD_ENTRY.label}`
            : `<b class="text-slate-400">${name}</b><br>not in the index`;
          tip.style.left = (e.point.x + 14) + 'px';
          tip.style.top = (e.point.y + 14) + 'px';
          tip.classList.remove('hidden');
          map.getCanvas().style.cursor = w != null ? 'pointer' : '';
          return;
        }

        const assoc = BY_COUNTRY[iso];
        const members = regionMembersOf(iso);
        map.setFilter('region-hover', ['in', ['get', 'iso'], ['literal', members || NONE]]);
        if (!assoc) { tip.classList.add('hidden'); map.getCanvas().style.cursor = ''; return; }
        map.getCanvas().style.cursor = 'pointer';
        const anyLive = assoc.some(x => x.status === 'live');
        tip.innerHTML =
          `<b class="${anyLive ? 'text-amber-400' : 'text-[#3bcdf0]'}">${name}</b><br>` +
          assoc.map(x => x.status === 'live'
            ? `${x.label} — click to open`
            : `<span class="text-slate-400">${x.label} — coming soon</span>`).join('<br>');
        tip.style.left = (e.point.x + 14) + 'px';
        tip.style.top = (e.point.y + 14) + 'px';
        tip.classList.remove('hidden');
      });

      map.on('mouseleave', 'country-fill', () => {
        tip.classList.add('hidden');
        map.getCanvas().style.cursor = '';
        map.setFilter('region-hover', ['in', ['get', 'iso'], ['literal', NONE]]);
      });

      map.on('click', 'country-fill', e => {
        closePicker();
        const f = e.features[0];
        const iso = f.properties.iso;
        const name = f.properties.name;

        if (mode === 'world') {
          if (!VWCE || VWCE.weights[iso] == null) return;
          if (WORLD_ENTRY.status === 'live') location.href = `dashboard/?index=${WORLD_ENTRY.id}`;
          else showToast(`${WORLD_ENTRY.label} — coming soon`);
          return;
        }

        const assoc = BY_COUNTRY[iso];
        if (!assoc) return;
        const live = assoc.filter(x => x.status === 'live');

        if (assoc.length === 1) {
          if (live.length) location.href = `dashboard/?index=${live[0].id}`;
          else showToast(`${name} — ${assoc[0].label} coming soon`);
          return;
        }
        if (!live.length) {
          showToast(`${name} — ${assoc.map(x => x.label).join(', ')} coming soon`);
          return;
        }
        // Several indices, at least one live → picker.
        picker.innerHTML =
          `<div class="px-3 py-1.5 border-b border-[#1e222d] text-slate-500 font-semibold">${name}</div>` +
          assoc.map(x => x.status === 'live'
            ? `<a href="dashboard/?index=${x.id}" class="block px-3 py-1.5 text-amber-300 hover:bg-[#1e222d] font-semibold">${x.label} →</a>`
            : `<div class="px-3 py-1.5 text-slate-500 cursor-default">${x.label} · coming soon</div>`).join('');
        picker.style.left = Math.min(e.point.x + 10, window.innerWidth - 210) + 'px';
        picker.style.top = Math.min(e.point.y + 10, window.innerHeight - 30 - assoc.length * 30) + 'px';
        picker.classList.remove('hidden');
        tip.classList.add('hidden');
      });

      // ---------- world (VWCE allocation) mode ----------
      const toggle = document.getElementById('world-toggle');
      const legendM = document.getElementById('legend-markets');
      const legendW = document.getElementById('legend-world');

      const enterWorld = async () => {
        if (!WORLD_ENTRY) return;
        if (!VWCE) {
          try {
            const r = await fetch(WORLD_ENTRY.weights + '?v=' + DAY);
            if (!r.ok) throw new Error(r.status);
            VWCE = await r.json();
          } catch (err) {
            showToast(`Couldn't load ${WORLD_ENTRY.label} weights — try again`);
            return;
          }
        }
        // sqrt scale (US ≈ 57% would otherwise make every other country invisible),
        // with a brightness floor so even 0.02% members are faintly lit.
        const maxW = Math.max(...Object.values(VWCE.weights));
        const pairs = [];
        for (const [iso, w] of Object.entries(VWCE.weights)) {
          const t = 0.12 + 0.88 * Math.sqrt(w / maxW);
          const c = [23 + (251 - 23) * t, 28 + (191 - 28) * t, 43 + (36 - 43) * t].map(Math.round);
          pairs.push(iso, `rgb(${c[0]},${c[1]},${c[2]})`);
        }
        map.setPaintProperty('country-fill', 'fill-color',
          ['match', ['get', 'iso'], ...pairs, 'rgba(0,0,0,0)']);
        map.setPaintProperty('country-fill', 'fill-opacity',
          ['match', ['get', 'iso'], Object.keys(VWCE.weights), 0.9, 0]);
        map.setLayoutProperty('country-outline', 'visibility', 'none');
        map.setFilter('region-hover', ['in', ['get', 'iso'], ['literal', NONE]]);
        document.getElementById('legend-world-label').textContent =
          `0 → ${maxW.toFixed(1)}% of ${WORLD_ENTRY.label} · as of ${VWCE.as_of}`;
        legendM.classList.add('hidden');
        legendW.classList.remove('hidden'); legendW.classList.add('flex');
        toggle.classList.add('border-[#3bcdf0]', 'text-[#3bcdf0]', 'bg-[#3bcdf0]/10');
        closePicker();
        tip.classList.add('hidden');
        mode = 'world';
      };

      const exitWorld = () => {
        map.setPaintProperty('country-fill', 'fill-color', FILL_COLOR_MARKETS);
        map.setPaintProperty('country-fill', 'fill-opacity', FILL_OPACITY_MARKETS);
        map.setLayoutProperty('country-outline', 'visibility', 'visible');
        legendW.classList.add('hidden'); legendW.classList.remove('flex');
        legendM.classList.remove('hidden');
        toggle.classList.remove('border-[#3bcdf0]', 'text-[#3bcdf0]', 'bg-[#3bcdf0]/10');
        tip.classList.add('hidden');
        mode = 'markets';
      };

      toggle.addEventListener('click', () => (mode === 'markets' ? enterWorld() : exitWorld()));
    }).catch(err => {
      console.error('globe init failed:', err);
      document.getElementById('globe-error').classList.remove('hidden');
    });
  </script>
</body>
</html>
