name: Daily Recap Video (YouTube Short)

on:
  schedule:
    - cron: '0 6 * * 2-6'   # 06:00 UTC, Tue–Sat — recaps the previous US close (sp500.json refreshes 23:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the payload only — no render, no upload'
        required: false
        default: 'false'
      privacy:
        description: 'Override privacy for this run: public / unlisted / private. Blank = use config.json.'
        required: false
        default: ''
      simulate_failure:
        description: 'Fail on purpose to test the failure alert'
        required: false
        default: 'false'

permissions:
  contents: write   # commits video/state.json (news memory)
  issues: write     # opens an issue when a run fails

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50   # freshness guard reads the data file's last commit date

      - name: Simulated failure (alert test)
        if: github.event.inputs.simulate_failure == 'true'
        run: |
          echo "simulate_failure=true - failing on purpose to test the alert."
          exit 1

      - name: Build & publish daily recap Short
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SHOTSTACK_API_KEY: ${{ secrets.SHOTSTACK_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' }}
          YT_PRIVACY: ${{ github.event.inputs.privacy }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node video/make_video.js --dry-run
          else
            node video/make_video.js
          fi

      - name: Commit news memory (video/state.json)
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "myendmess"
          git config user.email "boujnanemohamed23@gmail.com"
          git add video/state.json
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: video news memory $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily video pipeline failed"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Run failed on $(date -u '+%Y-%m-%d %H:%M UTC') (trigger: ${{ github.event_name }}). Log: $run_url"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
